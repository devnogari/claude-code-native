<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D97757"/>
      <stop offset="100%" style="stop-color:#C4603F"/>
    </linearGradient>
    <linearGradient id="termGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2D2D2D"/>
      <stop offset="100%" style="stop-color:#1A1A1A"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect x="32" y="32" width="448" height="448" rx="88" ry="88" fill="url(#bgGrad)"/>

  <!-- Terminal window -->
  <rect x="80" y="100" width="352" height="312" rx="24" ry="24" fill="url(#termGrad)"/>

  <!-- Terminal header bar -->
  <rect x="80" y="100" width="352" height="44" rx="24" ry="24" fill="#3D3D3D"/>
  <rect x="80" y="124" width="352" height="20" fill="#3D3D3D"/>

  <!-- Window buttons -->
  <circle cx="112" cy="122" r="10" fill="#FF5F56"/>
  <circle cx="144" cy="122" r="10" fill="#FFBD2E"/>
  <circle cx="176" cy="122" r="10" fill="#27CA40"/>

  <!-- Prompt chevron > -->
  <path d="M 120 200 L 160 240 L 120 280"
        stroke="#D97757" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Cursor line -->
  <rect x="180" y="224" width="180" height="32" rx="4" fill="#D97757" opacity="0.9"/>

  <!-- Code lines (decorative) -->
  <rect x="120" y="320" width="140" height="12" rx="6" fill="#666666"/>
  <rect x="280" y="320" width="80" height="12" rx="6" fill="#888888"/>
  <rect x="120" y="352" width="200" height="12" rx="6" fill="#555555"/>
</svg>
