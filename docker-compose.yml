services:
  traefik:
    image: traefik:v3.0
    container_name: ccn-traefik
    restart: unless-stopped
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - ccn-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ccn-backend
    restart: unless-stopped
    environment:
      - PORT=8080
      - DATABASE_URL=postgres://ccn:${DB_PASSWORD}@postgres:5432/claude_code_native?sslmode=disable
      - JWT_SECRET=${JWT_SECRET}
      - CLAUDE_PROJECTS_PATH=/claude-projects
      - LOG_LEVEL=info
    volumes:
      - ~/.claude:/claude-projects:ro
      - claude-sessions:/var/lib/ccn/sessions
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`ccn.localhost`)"
      - "traefik.http.routers.backend.entrypoints=web"
      - "traefik.http.services.backend.loadbalancer.server.port=8080"
    networks:
      - ccn-network

  postgres:
    image: postgres:18-alpine
    container_name: ccn-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=ccn
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=claude_code_native
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ccn -d claude_code_native"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    networks:
      - ccn-network

volumes:
  postgres-data:
    name: ccn-postgres-data
  claude-sessions:
    name: ccn-sessions

networks:
  ccn-network:
    name: ccn-network
    driver: bridge
